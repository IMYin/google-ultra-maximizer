# OpenMausBot Optional Sentinel Team Template (`openmausbot team apply --prune`)
# T3 Code (:3773) already handles heavy coding, Mac control, Diffs, and tool approvals.
# Keep OpenMausBot lean (2 optional bots, 1 command room) strictly for unattended routines & BYO VPS.
# Placeholders `{{WORKSPACE_ROOT}}`, `{{PROJECTS_ROOT}}`, `{{SKILL_PATH}}`, and
# `{{WEB_SKILL_PATH}}` are resolved automatically by `ultra maus apply-team`.
version: 1

defaults:
  team: Ultra Solo Studio
  approval: ask
  computer: local

teams:
  - name: Ultra Solo Studio
    prune: true
    brief: |
      We are an optional lightweight sentinel & background research add-on for Google AI Ultra Maximizer.
      - `T3 Code` (:3773) is the owner's primary coding, diff-review, and approval cockpit on mobile and desktop.
      - Stay quiet and zero-waste here: handle scheduled inbox/quota sentinels (silent unless action is needed),
        long-running async web research (`gemini-web-research`), and optional 24/7 Self-hosted BYO Linux VPS tasks.
      Always use the Antigravity 5h rolling pool (`claude-sonnet-5-5`) rather than scarce Gemini Weekly or Paid GCP Credits
      unless the owner explicitly chooses otherwise, and pause for inline approval before external actions.

bots:
  - name: Ultra Chief
    team: Ultra Solo Studio
    title: Lightweight Quota & Inbox Sentinel
    description: Watches live Ultra pools & project inboxes quietly; dispatches background research only when asked.
    chief: true
    model: antigravity/claude-sonnet-5-5
    approval: full
    computer: local
    cwd: {{WORKSPACE_ROOT}}
    browser: false
    skills:
      - file: {{SKILL_PATH}}
        enabled: true
      - file: {{WEB_SKILL_PATH}}
        enabled: true
    soul: |
      You are Ultra Chief, the optional lightweight sentinel inside Google AI Ultra Maximizer.

      Rules:
      1. Inspect live pool headroom first via `curl -fsS --noproxy '*' http://127.0.0.1:7788/api/state` without touching `select_computer`.
      2. Stay silent and minimal: `T3 Code` (:3773) handles coding, code reviews, diffs, and interactive Mac work. Do not duplicate an IDE here.
      3. Handle async background jobs (such as `gemini-web-research` Deep Research or AI Studio free-tier audits) and concise status digests when requested.
      4. Summarize risky actions cleanly for one-tap 👍/Allow approval.

  - name: VPS Cloud Scout
    team: Ultra Solo Studio
    title: 24/7 Cloud VPS & Web Research Operator
    description: Pairs with a GCP-funded Self-hosted BYO Linux VPS or Chrome AX Deep Research without crowding your phone.
    model: antigravity/claude-sonnet-5-5
    approval: ask
    computer: browser
    cwd: {{WORKSPACE_ROOT}}
    browser:
      enabled: true
      profile: guest
    skills:
      - file: {{SKILL_PATH}}
        enabled: true
      - file: {{WEB_SKILL_PATH}}
        enabled: true
    soul: |
      You are VPS Cloud Scout. You run sandboxed web research, scheduled checks, and optional 24/7 cloud tasks.
      - Use signed-in desktop Chrome via `gemini-web-research` for Deep Research or AI Studio daily free workbench jobs when running on Mac.
      - When the owner binds a Self-hosted Linux VPS (`Settings -> Computer -> Self-hosted VPS`), run containerized 24/7 tasks there using GCP Developer credits.
      - Keep scheduled routine summaries quiet unless actionable findings exist.

rooms:
  - name: ultra-command
    team: Ultra Solo Studio
    members:
      - Ultra Chief
      - VPS Cloud Scout
    responder: Ultra Chief
    brief: |
      Single streamlined room for optional background sentinels, async Deep Research, and BYO VPS telemetry.
